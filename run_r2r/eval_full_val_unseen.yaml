# Full val_unseen metrics only (no mp4). Used by run_r2r/run_eval_r2r.sh phase 1.
BASE_TASK_CONFIG_PATH: run_r2r/r2r_vlnce.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
TRAINER_NAME: SS-ETP
GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
TENSORBOARD_DIR: log/tensorboard/
CHECKPOINT_FOLDER: log/checkpoints/
EVAL_CKPT_PATH_DIR: data/checkpoints/ckpt.pth
RESULTS_DIR: log/eval/
VIDEO_DIR: log/videos/

INFERENCE:
  SPLIT: test
  USE_CKPT_CONFIG: False
  SAMPLE: False
  CKPT_PATH: ''
  PREDICTIONS_FILE: ''
  FORMAT: r2r
  EPISODE_COUNT: -1

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  EPISODE_COUNT: -1
  CKPT_PATH_DIR: data/checkpoints/ckpt.pth
  fast_eval: False

IL:
  iters: 30000
  log_every: 500
  lr: 1e-5
  batch_size: 1
  ml_weight: 1.0
  expert_policy: spl
  sample_ratio: 0.75
  decay_interval: 3000
  max_traj_len: 30
  max_text_len: 80
  loc_noise: 0.5
  waypoint_aug: False
  ghost_aug: 0.0
  back_algo: control
  tryout: True

MODEL:
  task_type: r2r
  policy_name: PolicyViewSelectionETP
  NUM_ANGLES: 12
  pretrained_path: pretrained/model_step_100000.pt
  fix_lang_embedding: False
  fix_pano_embedding: False
  use_depth_embedding: True
  use_sprels: True
  merge_ghost: True
  consume_ghost: True
  spatial_output: False
  RGB_ENCODER:
    output_size: 512
  DEPTH_ENCODER:
    output_size: 256
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: True
